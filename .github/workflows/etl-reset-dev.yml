name: ETL Reset Dev

on:
  workflow_dispatch:

jobs:
  etl-reset-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Clear DB and run ETL
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 120m
          script: |
            set -e

            echo "=== ETL Reset Dev started at $(date -u '+%Y-%m-%d %H:%M:%S UTC') ==="

            echo "=== [1/4] Clearing MongoDB collections ==="
            docker exec -i fragentic-backend-dev uv run python3 - <<'PYEOF'
            import asyncio
            from motor.motor_asyncio import AsyncIOMotorClient
            import os
            async def main():
                client = AsyncIOMotorClient(os.getenv("MONGO_URI"))
                db = client["fragentic"]
                r = await db["fragrances"].delete_many({})
                print(f"Deleted {r.deleted_count} fragrances")
                r = await db["descriptors"].delete_many({})
                print(f"Deleted {r.deleted_count} descriptors")
                client.close()
            asyncio.run(main())
            PYEOF
            echo "--- MongoDB clear finished at $(date -u '+%H:%M:%S UTC') ---"

            echo "=== [2/4] Clearing Redis cache ==="
            docker exec -i fragentic-backend-dev uv run python3 - <<'PYEOF'
            import asyncio
            import redis.asyncio as aioredis
            import os
            async def main():
                r = aioredis.from_url(os.getenv("REDIS_URL"), decode_responses=True)
                cursor, deleted = 0, 0
                while True:
                    cursor, keys = await r.scan(cursor, match="fragentic:*", count=100)
                    if keys:
                        await r.delete(*keys)
                        deleted += len(keys)
                    if cursor == 0:
                        break
                print(f"Deleted {deleted} Redis keys")
                await r.aclose()
            asyncio.run(main())
            PYEOF
            echo "--- Redis clear finished at $(date -u '+%H:%M:%S UTC') ---"

            echo "=== [3/4] Running ETL pipeline (this may take a while, progress logs every 250 rows) ==="
            etl_start=$(date +%s)
            docker exec fragentic-backend-dev uv run python3 -m app.etl_script.etl
            etl_end=$(date +%s)
            echo "--- ETL pipeline finished at $(date -u '+%H:%M:%S UTC') (took $((etl_end - etl_start))s) ---"

            echo "=== [4/4] Verifying data was loaded ==="
            docker exec -i fragentic-backend-dev uv run python3 - <<'PYEOF'
            import asyncio
            import sys
            from motor.motor_asyncio import AsyncIOMotorClient
            import os
            async def main():
                client = AsyncIOMotorClient(os.getenv("MONGO_URI"))
                db = client["fragentic"]
                count = await db["fragrances"].count_documents({})
                print(f"{count} fragrances in DB after ETL")
                client.close()
                if count == 0:
                    sys.exit(1)
            asyncio.run(main())
            PYEOF

            echo "=== ETL Reset Dev finished at $(date -u '+%Y-%m-%d %H:%M:%S UTC') ==="
