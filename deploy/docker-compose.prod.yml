services:
  backend-prod:
    image: ghcr.io/jsatchell03/fragentic-backend:latest
    container_name: fragentic-backend-prod
    restart: unless-stopped
    env_file: .env.prod
    networks:
      - shared-net-prod

  frontend-prod:
    image: ghcr.io/jsatchell03/fragentic-frontend:latest
    container_name: fragentic-frontend-prod
    restart: unless-stopped
    environment:
      BACKEND_HOST: backend-prod
      BACKEND_PORT: "8000"
    ports:
      - "127.0.0.1:8101:80"
    depends_on:
      - backend-prod
    networks:
      - shared-net-prod

networks:
  shared-net-prod:
    external: true
